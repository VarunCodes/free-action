name: Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Browsers are cached between runs, keyed on the Playwright version, because each version
      # needs its own browser builds. The system libraries they need are installed every time,
      # since each run starts on a fresh machine.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers and their system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install only the system libraries (browsers came from the cache)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      # CI is set by GitHub, so this builds the site and tests the build (see playwright.config.ts).
      # Random order catches tests that depend on each other. The github reporter doesn't print the
      # seed, so the run id is the seed: replay an order with `CI=1 npx playwright test --shuffle=<run id>`.
      - run: npx playwright test --shuffle=${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
