name: Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Not cached on purpose: measured in #35, a browser cache saved nothing (40s without, 41s
      # with), because the time goes on the system libraries, which every fresh runner needs.
      - run: npx playwright install --with-deps chromium webkit
      # CI is set by GitHub, so this builds the site and tests the build (see playwright.config.ts).
      # Random order catches tests that depend on each other. The github reporter doesn't print the
      # seed, so the run id is the seed: replay an order with `CI=1 npx playwright test --shuffle=<run id>`.
      - run: npx playwright test --shuffle=${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
